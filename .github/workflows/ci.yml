name: AgendaYA CI

on:
  push:
    branches: [ master, main, develop, 'hotfix/*' ]
  pull_request:
    branches: [ master, main, develop, 'hotfix/*' ]

jobs:
  validacion-y-tests:
    name: Integración (Format, Lint, Unit Tests, Build)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar formato
        run: npx prettier --check . || echo "omitir si Prettier no está configurado"

      - name: Verificar linter
        run: npm run lint || echo "omitir si ESLint no es restrictivo"

      - name: Ejecutar Pruebas Unitarias
        run: npm run test

      - name: Verificar Build
        run: npm run build

  deploy-dev:
    name: Deploy a Dev (Render Webhook)
    runs-on: ubuntu-latest
    needs: validacion-y-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Deploy Automático
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_DEV }}

  deploy-prod:
    name: Deploy a Prod (Render Webhook)
    runs-on: ubuntu-latest
    needs: validacion-y-tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    environment:
      name: production # activa la aprobación manual en GitHub
    steps:
      - name: Deploy
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_PROD }}